name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    name: Windows check
    runs-on: windows-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -x --tb=short

      - name: Build
        run: uv build
